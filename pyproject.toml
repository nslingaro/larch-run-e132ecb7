[project]
name = "larch"
version = "1.0.0"
description = "Larch Lettings Tenant Applications API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0.36,<2.1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-multipart>=0.0.18",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=44",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["larch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:larch.*",
    # starlette.testclient suggests httpx2; httpx stays until that package is vetted.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
